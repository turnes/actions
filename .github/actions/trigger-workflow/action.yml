name: 'Trigger Workflow in Another Repository'
description: 'Triggers a repository_dispatch event in another repository using GitHub API. The target repository must have a workflow that listens for repository_dispatch events.'

inputs:
  repo:
    description: 'Target repository in format owner/repo (e.g., octocat/hello-world)'
    required: true
  event_type:
    description: 'Event type to trigger in the target repository (e.g., deploy, build, release)'
    required: true
  payload:
    description: 'JSON object containing the client_payload data to pass to the workflow (optional, defaults to {})'
    required: false
    default: '{}'
  PAT:
    description: 'Personal Access Token with repo scope for the target repository'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate and trigger workflow
      shell: bash
      run: |
        set -e
        
        # Check if debug mode is enabled
        DEBUG_MODE="${ACTIONS_STEP_DEBUG:-false}"
        
        # Debug function
        debug() {
          if [ "$DEBUG_MODE" = "true" ]; then
            echo "::debug::$1"
          fi
        }
        
        debug "=== Trigger Workflow Action - Debug Mode Enabled ==="
        debug "Repository: ${{ inputs.repo }}"
        debug "Event Type: ${{ inputs.event_type }}"
        debug "Payload Input: ${{ inputs.payload }}"
        PAT_LENGTH=$(echo -n "${{ inputs.PAT }}" | wc -c | tr -d ' ')
        debug "PAT: [REDACTED - length: ${PAT_LENGTH} characters]"
        
        # Validate inputs
        if [ -z "${{ inputs.repo }}" ]; then
          echo "Error: repo input is required"
          exit 1
        fi
        
        if [ -z "${{ inputs.event_type }}" ]; then
          echo "Error: event_type input is required"
          exit 1
        fi
        
        if [ -z "${{ inputs.PAT }}" ]; then
          echo "Error: PAT input is required"
          exit 1
        fi
        
        # Set event_type
        EVENT_TYPE="${{ inputs.event_type }}"
        debug "Parsed Event Type: ${EVENT_TYPE}"
        
        # Validate and set payload (default to empty object if not provided)
        PAYLOAD_INPUT="${{ inputs.payload }}"
        if [ -z "$PAYLOAD_INPUT" ]; then
          PAYLOAD_INPUT="{}"
          debug "Payload input was empty, using default: {}"
        else
          debug "Payload input received: ${PAYLOAD_INPUT}"
        fi
        
        # Validate JSON format of payload
        echo "$PAYLOAD_INPUT" | jq . > /dev/null 2>&1 || {
          echo "Error: payload input must be valid JSON"
          debug "Invalid JSON payload: ${PAYLOAD_INPUT}"
          exit 1
        }
        
        # Parse payload JSON
        CLIENT_PAYLOAD=$(echo "$PAYLOAD_INPUT" | jq .)
        debug "Parsed Client Payload: $(echo "$CLIENT_PAYLOAD" | jq -c .)"
        
        # Extract owner and repo name
        REPO="${{ inputs.repo }}"
        debug "Target Repository: ${REPO}"
        
        # Prepare the API request
        API_URL="https://api.github.com/repos/${REPO}/dispatches"
        debug "API URL: ${API_URL}"
        
        # Create the request payload
        PAYLOAD=$(jq -n \
          --arg event_type "$EVENT_TYPE" \
          --argjson client_payload "$CLIENT_PAYLOAD" \
          '{event_type: $event_type, client_payload: $client_payload}')
        debug "Request Payload: $(echo "$PAYLOAD" | jq -c .)"
        
        echo "Triggering repository_dispatch event '${EVENT_TYPE}' in repository '${REPO}'"
        echo "Payload: ${PAYLOAD}"
        
        # Make the API request
        debug "Making API request to GitHub..."
        debug "Request Method: POST"
        debug "Request Headers: Accept: application/vnd.github+json, X-GitHub-Api-Version: 2022-11-28, Content-Type: application/json"
        
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ inputs.PAT }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}" \
          "${API_URL}")
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        debug "HTTP Status Code: ${HTTP_CODE}"
        debug "Response Body: ${BODY}"
        
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "✅ Successfully triggered workflow (HTTP $HTTP_CODE)"
          debug "Workflow trigger successful"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi
        else
          echo "❌ Failed to trigger workflow (HTTP $HTTP_CODE)"
          echo "Response: $BODY"
          debug "Workflow trigger failed with HTTP ${HTTP_CODE}"
          exit 1
        fi
        
        debug "=== Trigger Workflow Action - Completed ==="
